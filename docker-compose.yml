services:
  db:
    image: postgres:16-alpine
    container_name: taskvault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskvault
      POSTGRES_USER: taskvault
      POSTGRES_PASSWORD: taskvault_dev_password
    ports:
      - "5433:5432"
    volumes:
      - taskvault_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskvault -d taskvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskvault_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://taskvault:taskvault_dev_password@db:5432/taskvault
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskvault_data:
